name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]   # Note: Exact same name jo ci.yml mein `name:` hai
    types:
      - completed

env:
  AWS_REGION: us-east-1
  ECS_SERVICE: url-shortener-service
  ECS_CLUSTER: main-cluster
  ECS_TASK_DEFINITION: task-definition.json
  CONTAINER_NAME: url-shortener

jobs:
  deploy-ecs:
    runs-on: ubuntu-latest
    # Sirf tabhi chalega jab CI pipeline "SUCCESS" hoke khatam hui ho
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ secrets.DOCKERHUB_USERNAME }}/url-shortener:${{ github.sha }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true